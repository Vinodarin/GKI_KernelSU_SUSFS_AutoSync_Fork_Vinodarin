name: Auto Sync Original GKI KernelSU SUSFS

on:
  schedule:
    - cron: '0 */6 * * *' # Проверка и обновление каждые 6 часов
  workflow_dispatch: # Позволяет запустить синхронизацию вручную кнопкой

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Upstream
        on:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} -b main
